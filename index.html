<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amisha Sahay | MSc Geoinformatics</title>
  
  <style>
    /* Color Palette Variables */
    :root {
      --sage-green: #8A9A86;
      --dark-sage: #556B2F;
      --cream-bg: #FDFBF7;
      --cream-card: #F4F1EA;
      --text-dark: #2C3E35;
      --nav-bg: rgba(44, 62, 53, 0.85);
    }

    /* Global Resets */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--cream-bg);
      color: var(--text-dark);
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* Background Video Container */
    .video-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      overflow: hidden;
    }

    #bg-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Sage Green / Cream Overlay */
    .video-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        135deg, 
        rgba(138, 154, 134, 0.45), 
        rgba(253, 251, 247, 0.65)
      );
      backdrop-filter: blur(3px);
    }

    /* Centered Navigation Bar */
    .navbar-container {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 1100px;
      z-index: 1000;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--nav-bg);
      padding: 10px 24px;
      border-radius: 40px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
      backdrop-filter: blur(10px);
    }

    .logo {
      background-color: var(--sage-green);
      color: #ffffff;
      font-weight: bold;
      padding: 8px 14px;
      border-radius: 50%;
      font-size: 1rem;
    }

    .nav-links {
      display: flex;
      list-style: none;
      gap: 18px;
    }

    .nav-links a {
      color: #E8ECE9;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    .nav-links a:hover {
      color: var(--sage-green);
    }

    /* Hero & Profile Section */
    .hero-section {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding-top: 80px;
    }

    .profile-card {
      text-align: center;
      background: rgba(244, 241, 234, 0.85);
      padding: 35px 45px;
      border-radius: 24px;
      border: 1px solid rgba(138, 154, 134, 0.3);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      backdrop-filter: blur(8px);
    }

    .profile-img-wrapper {
      width: 180px;
      height: 180px;
      margin: 0 auto 16px auto;
      border-radius: 50%;
      border: 4px solid var(--sage-green);
      overflow: hidden;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
    }

    .profile-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .subtitle {
      color: var(--dark-sage);
      font-weight: 600;
      letter-spacing: 2px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <!-- Background Video Element -->
  <div class="video-background">
    <video autoplay loop muted playsinline id="bg-video">
      <source src="background-video.mp4" type="video/mp4" />
      Your browser does not support HTML5 video.
    </video>
    <div class="video-overlay"></div>
  </div>

  <!-- Navigation Bar -->
  <header class="navbar-container">
    <nav class="navbar">
      <div class="logo">AS</div>
      <ul class="nav-links">
        <li><a href="#home">Home</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#skills">Skills</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#academic">Academic Work</a></li>
        <li><a href="#maps">Maps</a></li>
        <li><a href="#education">Education</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- Main Hero Section -->
  <main class="hero-section" id="home">
    <div class="profile-card">
      <div class="profile-img-wrapper">
        <img src="profile.jpg" alt="Amisha Sahay" class="profile-img" />
      </div>
      <p class="subtitle">GIS • RS • CARTOGRAPHY</p>
    </div>
  </main>

</body>
</html>
